<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 晨报 · 每日热点仪表盘</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --muted:#7a8194; --line:#e9ecf3;
    --brand:#6d5efc; --brand2:#9b8cff; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --shadow:0 6px 24px rgba(31,36,48,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}

  /* Hero */
  .hero{
    background:linear-gradient(135deg,#6d5efc 0%,#9b8cff 55%,#c4bcff 100%);
    color:#fff;padding:34px 18px 30px;margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .hero-inner{max-width:1180px;margin:0 auto;padding:0 18px}
  .hero .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
  .hero h1{font-size:30px;font-weight:800;margin:6px 0 4px;letter-spacing:.5px}
  .hero .sub{font-size:14px;opacity:.92}
  .hero .sub b{font-weight:700}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .stat{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    border-radius:14px;padding:10px 16px;min-width:96px;backdrop-filter:blur(4px);
  }
  .stat .n{font-size:22px;font-weight:800;line-height:1}
  .stat .l{font-size:12px;opacity:.9;margin-top:4px}

  /* Nav */
  .nav{
    position:sticky;top:0;z-index:20;background:rgba(246,247,251,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:10px 0;margin-bottom:22px;
  }
  .nav-inner{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap}
  .nav a{
    font-size:13px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .nav a:hover{border-color:var(--brand);color:var(--brand)}
  .nav a .cnt{font-size:11px;background:var(--brand);color:#fff;border-radius:999px;padding:1px 7px;font-weight:700}
  .nav a.fallback{margin-left:auto;background:#fff7ed;border-color:#fed7aa;color:var(--amber)}

  /* Section */
  .section{margin-bottom:34px;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-num{
    width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
    font-weight:800;font-size:14px;color:#fff;background:var(--brand);
  }
  .sec-head h2{font-size:19px;font-weight:800}
  .sec-head .tag{font-size:12px;color:var(--muted);margin-left:auto;font-weight:600}

  /* Grid + cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;transition:.15s;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--brand2)}
  .card .idx{
    position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;color:var(--muted);
    background:var(--bg);border-radius:8px;padding:2px 8px;
  }
  .card h3{font-size:15.5px;font-weight:700;line-height:1.4;padding-right:42px}
  .chip{
    align-self:flex-start;font-size:11.5px;font-weight:600;color:var(--brand);
    background:#f1eeff;border:1px solid #e3ddff;border-radius:999px;padding:3px 10px;
  }
  .card p{font-size:13.5px;color:#475067;line-height:1.6}
  .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
  .card .src{font-size:11.5px;color:var(--muted)}
  .card .link{
    font-size:12.5px;font-weight:700;color:var(--brand);display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--line);border-radius:9px;padding:5px 10px;transition:.15s;
  }
  .card .link:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* States */
  .loading,.error{padding:60px 20px;text-align:center;color:var(--muted)}
  .error{color:var(--red)}
  .spinner{
    width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Footer */
  .foot-note{
    border-top:1px dashed var(--line);margin-top:34px;padding-top:18px;
    font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  }
  .foot-note a{color:var(--brand);font-weight:600}
  .foot-note .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  @media (max-width:560px){
    .hero h1{font-size:24px}
    .stat{min-width:84px;padding:8px 12px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">AI 晨报 · 每日热点</div>
      <h1 id="heroTitle">加载中…</h1>
      <div class="sub" id="heroSub">正在获取最新日报</div>
      <div class="stats" id="heroStats"></div>
    </div>
  </header>

  <nav class="nav" id="nav" style="display:none">
    <div class="nav-inner" id="navInner"></div>
  </nav>

  <main class="wrap">
    <div id="content">
      <div class="loading"><div class="spinner"></div>正在获取最新财经科技日报…</div>
    </div>
    <div class="foot-note" id="footNote" style="display:none"></div>
  </main>

<script>
(function(){
  "use strict";
  var UA = "aihot-skill/1.2.1 (+https://aihot.virxact.com/aihot-skill/)";
  var API = "https://aihot.virxact.com/api/v1/dailies/";
  var SECTION_ORDER = ["模型发布/更新","产品发布/更新","行业动态","论文研究","技巧与观点"];

  function el(id){ return document.getElementById(id); }

  // 北京时间人话格式
  function fmtDateCN(yyyymmdd){
    if(!yyyymmdd) return "";
    var p = String(yyyymmdd).split("-");
    if(p.length!==3) return yyyymmdd;
    var y=+p[0], m=+p[1], d=+p[2];
    var dt=new Date(y, m-1, d);
    var wd=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][dt.getDay()];
    return y+"年"+m+"月"+d+"日 "+wd;
  }
  function fmtBeijingTime(iso){
    if(!iso) return "";
    try{
      var d=new Date(iso);
      var date=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(d);
      var time=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
      return date+" "+time+"（北京时间）";
    }catch(e){ return iso; }
  }
  function truncate(str,n){
    str=(str||"").trim();
    if([...str].length<=n) return str;
    return [...str].slice(0,n).join("")+"…";
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"]/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  async function fetchJSON(url){
    var r=await fetch(url,{headers:{"User-Agent":UA}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }

  async function load(){
    var today=new Date().toISOString().slice(0,10);
    var data=null, fallback=false;
    try{
      data=await fetchJSON(API+today);
    }catch(e){
      fallback=true;
    }
    if(!data){
      try{
        data=await fetchJSON(API+"latest");
        fallback=true;
      }catch(e2){
        throw new Error("无法获取日报数据");
      }
    }
    return {data:data, fallback:fallback};
  }

  function render(report, fallback){
    var sections = (report.sections||[]).filter(function(s){ return SECTION_ORDER.indexOf(s.label)>=0; });
    // 按固定顺序重排
    sections.sort(function(a,b){ return SECTION_ORDER.indexOf(a.label)-SECTION_ORDER.indexOf(b.label); });

    var total=0;
    sections.forEach(function(s){ total+=(s.items||[]).length; });

    // Hero
    el("heroTitle").textContent = truncate("AI 晨报 · "+fmtDateCN(report.date), 40);
    var subParts=["数据日期：<b>"+fmtDateCN(report.date)+"</b>"];
    if(report.generatedAt) subParts.push("生成于 "+fmtBeijingTime(report.generatedAt));
    if(fallback) subParts.push("（当日尚未生成，已回退至最近一期）");
    el("heroSub").innerHTML = subParts.join(" ｜ ");

    var statsHtml = '<div class="stat"><div class="n">'+total+'</div><div class="l">总条数</div></div>';
    sections.forEach(function(s){
      statsHtml += '<div class="stat"><div class="n">'+(s.items||[]).length+'</div><div class="l">'+esc(s.label)+'</div></div>';
    });
    el("heroStats").innerHTML = statsHtml;

    // Nav
    var navHtml = "";
    sections.forEach(function(s, i){
      var anchor="sec-"+i;
      navHtml += '<a href="#'+anchor+'">'+esc(s.label)+'<span class="cnt">'+(s.items||[]).length+'</span></a>';
    });
    if(fallback){
      navHtml += '<a class="fallback" href="'+esc((report.links&&report.links.aihot)||"https://aihot.virxact.com")+'" target="_blank" rel="noopener noreferrer">最近一期 ↗</a>';
    }
    el("navInner").innerHTML = navHtml;
    el("nav").style.display = "block";

    // Content
    var html="";
    var g=0;
    sections.forEach(function(s, i){
      var items=s.items||[];
      if(!items.length) return;
      html += '<section class="section" id="sec-'+i+'">';
      html += '<div class="sec-head"><div class="sec-num">'+(i+1)+'</div><h2>'+esc(s.label)+'</h2><div class="tag">'+(s.items||[]).length+' 条</div></div>';
      html += '<div class="grid">';
      items.forEach(function(it){
        g++;
        var orig = (it.links&&it.links.original) || (it.links&&it.links.aihot) || "#";
        var src = (it.source&&it.source.name) || "AIHOT";
        html += '<article class="card">';
        html += '<span class="idx">#'+g+'</span>';
        html += '<span class="chip">'+esc(src)+'</span>';
        html += '<h3>'+esc(it.title)+'</h3>';
        html += '<p>'+esc(truncate(it.summary,60))+'</p>';
        html += '<div class="foot"><span class="src">来源：'+esc(src)+'</span>';
        html += '<a class="link" href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">原文 ↗</a></div>';
        html += '</article>';
      });
      html += '</div></section>';
    });
    if(!html) html = '<div class="loading">暂无内容</div>';
    el("content").innerHTML = html;

    // Footer
    var src = (report.attribution&&report.attribution.url) || (report.links&&report.links.aihot) || "https://aihot.virxact.com";
    var srcName = (report.attribution&&report.attribution.name) || "AIHOT";
    var fn = el("footNote");
    fn.style.display="flex";
    fn.innerHTML = '<span class="pill">共 '+total+' 条</span>'
      + '<span>数据源：<a href="'+esc(src)+'" target="_blank" rel="noopener noreferrer">'+esc(srcName)+'</a></span>'
      + '<span>本页为单文件静态仪表盘，数据经 aihot 接口实时拉取</span>';
  }

  load().then(function(res){
    render(res.data.report, res.fallback);
  }).catch(function(err){
    el("content").innerHTML = '<div class="error">加载失败：'+esc(err.message)+'<br>请检查网络后刷新重试。</div>';
    el("heroSub").textContent = "数据获取失败";
  });
})();
</script>
</body>
</html>
